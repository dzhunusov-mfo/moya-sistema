<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя система</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plastic:#f6f4ef; --slot:#fdfcf9; --slot-line:#e3dfd6;
    --track:#eceae3; --knob-dot:#3a3a38;
    --ink:#2f2d2a; --ink-soft:#8a867d;
    --ok:#2e9e5b; --err:#c1503f; --accent:#2f6fed;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:'Inter',system-ui,sans-serif;
    background:linear-gradient(160deg,#dcd7cd,#cfc9bd);
    min-height:100vh;color:var(--ink);
    display:flex;justify-content:center;padding:16px 12px 30px;
  }
  .board{
    width:100%;max-width:440px;background:var(--plastic);border-radius:26px;
    box-shadow:0 18px 40px rgba(60,50,35,.28), inset 0 2px 0 rgba(255,255,255,.8);
    padding:18px 16px 16px;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;margin:2px 6px 12px}
  h1{font-family:'Caveat',cursive;font-size:30px;font-weight:700;margin:0}
  .date{font-size:12.5px;color:var(--ink-soft);font-weight:500}

  .tabs{display:flex;gap:6px;background:var(--track);border-radius:14px;padding:4px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px 6px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;user-select:none;transition:all .15s}
  .tab.active{background:var(--ink);color:#fff}
  .view{display:none}
  .view.active{display:block}

  /* ---------- ДНЕВНИК ---------- */
  textarea{
    width:100%;min-height:120px;resize:vertical;
    border:1px solid var(--slot-line);border-radius:14px;background:var(--slot);
    font-family:'Inter',sans-serif;font-size:16px;line-height:1.4;color:var(--ink);
    padding:14px;box-shadow:inset 0 2px 3px rgba(120,105,80,.08);
  }
  textarea:focus{outline:none;border-color:var(--accent)}
  .opt{display:flex;align-items:center;gap:8px;margin:10px 4px 12px;font-size:13.5px;color:var(--ink-soft)}
  .opt input{width:18px;height:18px;accent-color:var(--accent)}
  .btn{
    border:none;border-radius:14px;padding:14px 12px;text-align:center;width:100%;
    font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;
  }
  .btn:active{transform:scale(.98)}
  .btn-main{background:var(--ink);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .btn-main:disabled{background:#b9b4a9;box-shadow:none;pointer-events:none}

  .queue{margin-top:16px}
  .qitem{
    display:flex;gap:10px;align-items:flex-start;background:var(--slot);
    border:1px solid var(--slot-line);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  }
  .qicon{flex:none;width:20px;text-align:center;font-size:15px;margin-top:1px}
  .qbody{flex:1;min-width:0}
  .qtext{font-size:13.5px;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .qmeta{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .qretry{flex:none;border:none;background:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px}
  .empty-hint{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:10px 4px}

  /* ---------- ПРИВЫЧКИ ---------- */
  .score{margin:0 4px 14px;display:flex;align-items:center;gap:10px}
  .score-bar{flex:1;height:8px;border-radius:6px;background:var(--track);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
  .score-fill{height:100%;width:0%;background:var(--ok);border-radius:6px;transition:width .3s}
  .score-num{font-size:14px;font-weight:600;min-width:48px;text-align:right}
  .habit{
    display:flex;align-items:center;gap:10px;background:var(--slot);
    border:1px solid var(--slot-line);border-radius:14px;
    padding:8px 10px 8px 16px;margin-bottom:8px;cursor:pointer;user-select:none;
    box-shadow:inset 0 2px 3px rgba(120,105,80,.10);
  }
  .habit-name{flex:1;font-family:'Caveat',cursive;font-size:22px;font-weight:600;line-height:1.02}
  .slider{position:relative;width:74px;height:34px;flex:none;background:var(--track);border-radius:20px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
  .mark{position:absolute;top:50%;left:12px;transform:translateY(-50%);font-size:18px;font-weight:800;color:var(--ok);opacity:0;transition:opacity .2s}
  .knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .22s cubic-bezier(.34,1.4,.64,1);display:flex;align-items:center;justify-content:center}
  .knob::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--knob-dot)}
  .habit[data-on="1"] .knob{left:calc(100% - 31px)}
  .habit[data-on="1"] .mark{opacity:1}
  .habit[data-on="1"]{background:#f4faf3;border-color:#d6e8d4}
  .status-line{margin-top:10px;font-size:13px;text-align:center;min-height:18px}
  .status-line.ok{color:var(--ok)}
  .status-line.err{color:var(--err)}
</style>
</head>
<body>
<div class="board">
  <header>
    <h1>Моя система</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="diary">Дневник</div>
    <div class="tab" data-tab="habits">Привычки</div>
  </div>

  <!-- ДНЕВНИК -->
  <div class="view active" id="view-diary">
    <textarea id="diaryText" placeholder="Надиктуй или напиши мысль..."></textarea>
    <label class="opt">
      <input type="checkbox" id="withDate">
      Добавить строку с датой (первая запись за день)
    </label>
    <button class="btn btn-main" id="sendDiary" disabled>Записать в дневник</button>
    <div class="queue" id="diaryQueue"></div>
  </div>

  <!-- ПРИВЫЧКИ -->
  <div class="view" id="view-habits">
    <div class="score">
      <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
      <div class="score-num" id="scoreNum">0 / 15</div>
    </div>
    <div id="habitList"></div>
    <button class="btn btn-main off" id="sendHabits" disabled>Записать в Трекинг 3.0</button>
    <div class="status-line" id="habitsStatus"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var WEBHOOK = "https://script.google.com/macros/s/AKfycbzp29-dAYE_NwQkFLASFm8Xl1BaT7ImJygSWBijg1_eb-efSp3cor0bQ5aSpqtkZuTN/exec";
var memStore = {};

function storeGet(key){
  return new Promise(function(resolve){
    if (window.storage && window.storage.get) {
      window.storage.get(key).then(function(r){ resolve(r && r.value ? r.value : null); }).catch(function(){ resolve(null); });
    } else {
      try { resolve(window.localStorage ? localStorage.getItem(key) : (memStore[key]||null)); }
      catch(e){ resolve(memStore[key]||null); }
    }
  });
}
function storeSet(key, val){
  memStore[key] = val;
  if (window.storage && window.storage.set) { window.storage.set(key, val).catch(function(){}); return; }
  try { if (window.localStorage) localStorage.setItem(key, val); } catch(e){}
}

var now = new Date();
function p2(n){ return (n<10?"0":"")+n; }
var iso = now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate());
var ruDate = p2(now.getDate())+"."+p2(now.getMonth()+1)+"."+now.getFullYear();
var weekdays = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
document.getElementById("dateLabel").textContent = ruDate+", "+weekdays[now.getDay()];

/* ---------------- TABS ---------------- */
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
    document.querySelectorAll(".view").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    document.getElementById("view-"+t.dataset.tab).classList.add("active");
  });
});

/* ---------------- ДНЕВНИК ---------------- */
var diaryQueue = [];
var DQ_KEY = "diary-queue-v1";
var LAST_DATE_KEY = "diary-last-date-v1";

function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,7); }

function renderQueue(){
  var el = document.getElementById("diaryQueue");
  if (!diaryQueue.length){ el.innerHTML = '<div class="empty-hint">Записи появятся здесь после отправки.</div>'; return; }
  var html = "";
  diaryQueue.slice().reverse().forEach(function(item){
    var icon = item.status==="sent" ? "✅" : item.status==="error" ? "⚠️" : "⏳";
    var meta = item.status==="sent" ? "Записано" : item.status==="error" ? "Не отправлено — " + (item.error||"ошибка") : "Отправка...";
    html += '<div class="qitem">' +
      '<div class="qicon">'+icon+'</div>' +
      '<div class="qbody"><div class="qtext">'+escapeHtml(item.text.slice(0,140))+(item.text.length>140?"…":"")+'</div>' +
      '<div class="qmeta">'+meta+'</div></div>' +
      (item.status==="error" ? '<button class="qretry" data-id="'+item.id+'">Повторить</button>' : '') +
      '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".qretry").forEach(function(btn){
    btn.addEventListener("click", function(){ retryItem(btn.dataset.id); });
  });
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

async function persistQueue(){ try { await storeSet(DQ_KEY, JSON.stringify(diaryQueue)); } catch(e){} }

async function sendDiaryItem(item){
  item.status = "pending"; renderQueue();
  try {
    var body = new URLSearchParams();
    body.set("text", item.text);
    if (item.includeDate) body.set("date", item.dateStr);
    var res = await fetch(WEBHOOK, { method: "POST", body: body });
    var txt = await res.text();
    if (/^OK/.test(txt)) {
      item.status = "sent";
      if (item.includeDate) await storeSet(LAST_DATE_KEY, item.dateStr);
    } else {
      item.status = "error"; item.error = txt.slice(0,80);
    }
  } catch(e) {
    item.status = "error"; item.error = "нет соединения";
  }
  await persistQueue(); renderQueue();
}

function retryItem(id){
  var item = diaryQueue.find(function(i){ return i.id===id; });
  if (item) sendDiaryItem(item);
}

async function retryAllFailed(){
  for (var i=0;i<diaryQueue.length;i++){
    if (diaryQueue[i].status==="error") await sendDiaryItem(diaryQueue[i]);
  }
}

var diaryTextEl = document.getElementById("diaryText");
var sendDiaryBtn = document.getElementById("sendDiary");
var withDateEl = document.getElementById("withDate");

diaryTextEl.addEventListener("input", function(){
  sendDiaryBtn.disabled = diaryTextEl.value.trim().length === 0;
});

sendDiaryBtn.addEventListener("click", async function(){
  var text = diaryTextEl.value.trim();
  if (!text) return;
  var item = { id: uid(), text: text, includeDate: withDateEl.checked, dateStr: ruDate, status: "pending", createdAt: Date.now() };
  diaryQueue.push(item);
  diaryTextEl.value = "";
  sendDiaryBtn.disabled = true;
  withDateEl.checked = false;
  renderQueue();
  await persistQueue();
  await sendDiaryItem(item);
});

window.addEventListener("online", retryAllFailed);

/* ---------------- ПРИВЫЧКИ ---------------- */
var HABITS = [
  "Рефлексия","Чтение","Визуализация","Аффирмация","Казахский язык",
  "Тренировка теннис","Ужин до 18-00","Уроки гитары","Дыхание Вима Хофа","Приседания",
  "Ретракторы лопаток","Отжимания / подтягивания","Сон до 21-00","Телефон выкл. до 20-00","Тренировка бокс"
];
var H_KEY = "habit-tracker-v2";
var hState = {};

function hToday(){
  if (!hState[iso] || hState[iso].length !== HABITS.length) hState[iso] = HABITS.map(function(){ return 0; });
  return hState[iso];
}
async function persistHabits(){ try { await storeSet(H_KEY, JSON.stringify(hState)); } catch(e){} }

function updateHabitsUI(){
  var t = hToday(), done = 0;
  for (var i=0;i<t.length;i++) done += t[i];
  document.getElementById("scoreNum").textContent = done+" / "+HABITS.length;
  document.getElementById("scoreFill").style.width = (done/HABITS.length*100)+"%";
  document.getElementById("sendHabits").disabled = done === 0;
}

function renderHabits(){
  var list = document.getElementById("habitList");
  list.innerHTML = "";
  var t = hToday();
  HABITS.forEach(function(name, idx){
    var row = document.createElement("div");
    row.className = "habit";
    row.setAttribute("data-on", t[idx] ? "1" : "0");
    row.innerHTML = '<div class="habit-name">'+name+'</div><div class="slider"><span class="mark">✓</span><div class="knob"></div></div>';
    row.addEventListener("click", function(){
      t[idx] = t[idx] ? 0 : 1;
      row.setAttribute("data-on", t[idx] ? "1" : "0");
      updateHabitsUI(); persistHabits();
    });
    list.appendChild(row);
  });
  updateHabitsUI();
}

document.getElementById("sendHabits").addEventListener("click", async function(){
  var t = hToday();
  var statusEl = document.getElementById("habitsStatus");
  statusEl.textContent = "Отправка..."; statusEl.className = "status-line";
  try {
    var body = new URLSearchParams();
    body.set("mode", "habits");
    body.set("date", ruDate);
    body.set("vals", t.join(","));
    var res = await fetch(WEBHOOK, { method: "POST", body: body });
    var txt = await res.text();
    if (/^OK/.test(txt)) { statusEl.textContent = "Записано ✓"; statusEl.className = "status-line ok"; }
    else { statusEl.textContent = "Ошибка: " + txt.slice(0,80); statusEl.className = "status-line err"; }
  } catch(e) {
    statusEl.textContent = "Нет соединения — попробуй ещё раз"; statusEl.className = "status-line err";
  }
});

/* ---------------- INIT ---------------- */
(async function init(){
  var dq = await storeGet(DQ_KEY);
  if (dq){ try { var parsed = JSON.parse(dq); if (Array.isArray(parsed)) diaryQueue = parsed; } catch(e){} }
  renderQueue();
  retryAllFailed();

  var lastDate = await storeGet(LAST_DATE_KEY);
  withDateEl.checked = lastDate !== ruDate;

  var hs = await storeGet(H_KEY);
  if (hs){ try { var ph = JSON.parse(hs); if (ph && typeof ph === "object") hState = ph; } catch(e){} }
  renderHabits();
})();
})();
</script>
</body>
</html>
